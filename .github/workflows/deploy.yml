name: Triển khai

# Mỗi lần code gộp vào main, báo Render dựng và chạy bản mới (Deploy Hook của dịch vụ).
# Cần secret của repo: RENDER_DEPLOY_HOOK (Render → dịch vụ → Settings → Deploy Hook).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Báo Render triển khai bản mới
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa đặt RENDER_DEPLOY_HOOK, bỏ qua."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "Render trả lời HTTP %{http_code}\n"
