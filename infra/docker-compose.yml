name: it-onsite

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itonsite
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Cần đặt DB_PASSWORD trong infra/.env}
      POSTGRES_DB: itonsite
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itonsite -d itonsite"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://itonsite:${DB_PASSWORD}@db:5432/itonsite
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong infra/.env}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?Cần đặt CREDENTIAL_KEY trong infra/.env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: '["${APP_URL:-http://localhost:8080}"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
